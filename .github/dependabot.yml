# Version-update pull requests are switched off (limit 0) so the build stays stable.
# Security fixes still arrive through "Dependabot security updates" (repo Settings -> Advanced Security).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
