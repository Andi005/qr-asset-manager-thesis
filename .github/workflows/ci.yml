# Runs on every pull request and on every push to main.
# A pull request may only be merged when all jobs here are green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # verify = compile, formatting check, all tests (Testcontainers starts PostgreSQL), coverage
      - run: ./mvnw -B verify
      - name: SUS scorer self-test (evaluation tool)
        run: java tools/SusScore.java --self-test
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 30

  docker:
    name: Docker image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same command as in the README: build the image and start the system with demo data.
      - run: docker compose up --build --detach
      - name: Wait until the app reports healthy, then fetch the login page
        run: |
          for i in $(seq 1 90); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8080/actuator/health
          curl -fs http://localhost:8080/login | grep -q "Kyçuni"
          # Protected pages redirect to the login page.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets)" = "302"
      - name: Show the app log if something failed
        if: failure()
        run: docker compose logs
      - run: docker compose down
