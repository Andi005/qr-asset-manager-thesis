spring:
  application:
    name: qr-asset-manager
  web:
    # The interface is in Albanian (messages.properties); no language switching.
    locale: sq
    locale-resolver: fixed
  messages:
    basename: messages
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qram}
    username: ${DB_USER:qram}
    password: ${DB_PASSWORD:qram}
  jpa:
    # Pages never load data lazily while rendering: services return everything a page needs.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  # Hosting platforms such as Render tell the app which port to use through PORT.
  port: ${PORT:8080}
  # Behind a hosting proxy, build links and redirects with the original https:// address.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 4h

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Printed on every QR label: <base-url>/a/<TAG>. Must be final before labels are printed.
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # "Today" for expiry checks is computed in this zone.
  zone: ${APP_ZONE:Europe/Belgrade}
  # Password of the first ADMIN account, created only when the user table is empty.
  admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}
  # Password of the demo accounts (demo profile only).
  demo-password: ${DEMO_PASSWORD:demo12345}

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
