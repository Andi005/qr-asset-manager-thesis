<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sq">
<head th:replace="~{fragments/layout :: head(${license == null} ? #{license.new.title} : #{license.edit.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 720px">
  <h1 class="h3 mb-3" th:text="${license == null} ? #{license.new.title} : #{license.edit.title}">License</h1>
  <form th:action="${license == null} ? @{/licenses} : @{/licenses/{id}(id=${license.id})}"
        th:object="${form}" method="post" novalidate>
    <div th:replace="~{fragments/layout :: globalErrors}"></div>
    <input type="hidden" th:field="*{version}">
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label" for="name" th:text="#{license.name}">Name</label>
        <input class="form-control" th:field="*{name}" th:errorclass="is-invalid" maxlength="120" required>
        <div class="invalid-feedback" th:errors="*{name}">error</div>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="vendor" th:text="#{license.vendor}">Vendor</label>
        <input class="form-control" th:field="*{vendor}" th:errorclass="is-invalid" maxlength="80">
        <div class="invalid-feedback" th:errors="*{vendor}">error</div>
      </div>
      <div class="col-6 col-md-4">
        <label class="form-label" for="seatsTotal" th:text="#{license.seatsTotal}">Seats</label>
        <input class="form-control" type="number" min="1" max="100000" th:field="*{seatsTotal}"
               th:errorclass="is-invalid" required>
        <div class="invalid-feedback" th:errors="*{seatsTotal}">error</div>
      </div>
      <div class="col-6 col-md-4">
        <label class="form-label" for="expiryDate" th:text="#{license.expiryDate}">Expiry</label>
        <input class="form-control" type="date" th:field="*{expiryDate}" th:errorclass="is-invalid">
        <div class="form-text" th:text="#{license.perpetualHint}">hint</div>
        <div class="invalid-feedback" th:errors="*{expiryDate}">error</div>
      </div>
      <div class="col-12">
        <label class="form-label" for="notes" th:text="#{license.notes}">Notes</label>
        <textarea class="form-control" th:field="*{notes}" th:errorclass="is-invalid" rows="3" maxlength="2000"></textarea>
        <div class="invalid-feedback" th:errors="*{notes}">error</div>
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary btn-lg" type="submit" th:text="#{common.save}">Save</button>
      <a class="btn btn-outline-secondary btn-lg"
         th:href="${license == null} ? @{/licenses} : @{/licenses/{id}(id=${license.id})}"
         th:text="#{common.cancel}">Cancel</a>
    </div>
  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
