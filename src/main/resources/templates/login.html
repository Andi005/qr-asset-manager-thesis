<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sq">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body class="bg-body-tertiary">
<main class="container py-5" style="max-width: 420px">
  <h1 class="h4 mb-1 text-center" th:text="#{app.name}">App</h1>
  <p class="text-center text-body-secondary small mb-4" th:text="#{login.hint}">hint</p>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h2 class="h5 mb-3" th:text="#{login.title}">Log in</h2>
      <div th:if="${param.error}" class="alert alert-danger py-2" th:text="#{login.error}">Error</div>
      <div th:if="${param.logout}" class="alert alert-success py-2" th:text="#{login.loggedOut}">Logged out</div>
      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label" for="username" th:text="#{login.username}">Username</label>
          <input class="form-control form-control-lg" id="username" name="username" autocomplete="username"
                 autocapitalize="none" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password" th:text="#{login.password}">Password</label>
          <input class="form-control form-control-lg" id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit" th:text="#{login.submit}">Log in</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
