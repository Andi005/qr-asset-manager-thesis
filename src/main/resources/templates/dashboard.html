<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="sq">
<head th:replace="~{fragments/layout :: head(#{dashboard.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <h1 class="h3 mb-4" th:text="#{dashboard.title}">Dashboard</h1>

  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <a class="card stat-card h-100 text-decoration-none" th:href="@{/assets}">
        <div class="card-body">
          <div class="stat-value" th:text="${totalAssets}">0</div>
          <div class="stat-label" th:text="#{dashboard.totalAssets}">Assets</div>
        </div>
      </a>
    </div>
    <div class="col-6 col-md-3">
      <div class="card stat-card h-100">
        <div class="card-body">
          <div class="stat-value" th:text="${assigned}">0</div>
          <div class="stat-label" th:text="#{dashboard.assigned}">Assigned</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <a class="card stat-card h-100 text-decoration-none" th:href="@{/assets(status='IN_REPAIR')}">
        <div class="card-body">
          <div class="stat-value" th:text="${inRepair}">0</div>
          <div class="stat-label" th:text="#{dashboard.inRepair}">In repair</div>
        </div>
      </a>
    </div>
    <div class="col-6 col-md-3">
      <a class="card stat-card h-100 text-decoration-none" th:href="@{/licenses}">
        <div class="card-body">
          <div class="stat-value" th:text="${licenseCount}">0</div>
          <div class="stat-label" th:text="#{dashboard.licenses}">Licenses</div>
        </div>
      </a>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <a class="card h-100 text-decoration-none border-warning" th:href="@{/expiring}">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-baseline">
            <h2 class="h6 mb-2" th:text="#{dashboard.expiringSoon}">Expiring</h2>
            <span class="stat-value text-warning-emphasis"
                  th:text="${expiring.licensesSoon.size() + expiring.warrantiesSoon.size()}">0</span>
          </div>
          <ul class="list-unstyled small mb-0">
            <li th:each="l, s : ${expiring.licensesSoon}" th:if="${s.index < 4}">
              <span th:text="${l.name}">License</span> ·
              <span class="text-body-secondary" th:text="${@fmt.date(l.expiryDate)}">date</span>
            </li>
            <li th:each="a, s : ${expiring.warrantiesSoon}" th:if="${s.index < 3}">
              <span th:text="${a.tag + ' ' + a.displayName}">Asset</span> ·
              <span class="text-body-secondary" th:text="${@fmt.date(a.warrantyEndDate)}">date</span>
            </li>
          </ul>
        </div>
      </a>
    </div>
    <div class="col-md-6">
      <a class="card h-100 text-decoration-none border-danger" th:href="@{/expiring}">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-baseline">
            <h2 class="h6 mb-2" th:text="#{dashboard.expired}">Expired</h2>
            <span class="stat-value text-danger-emphasis"
                  th:text="${expiring.licensesExpired.size() + expiring.warrantiesExpired.size()}">0</span>
          </div>
          <ul class="list-unstyled small mb-0">
            <li th:each="l, s : ${expiring.licensesExpired}" th:if="${s.index < 4}">
              <span th:text="${l.name}">License</span> ·
              <span class="text-body-secondary" th:text="${@fmt.date(l.expiryDate)}">date</span>
            </li>
          </ul>
        </div>
      </a>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-4" sec:authorize="hasAnyRole('ADMIN','IT_STAFF')">
      <h2 class="h6" th:text="#{dashboard.quick}">Quick actions</h2>
      <div class="d-grid gap-2">
        <a class="btn btn-primary" th:href="@{/assets/new}" th:text="#{dashboard.newAsset}">New asset</a>
        <a class="btn btn-outline-primary" th:href="@{/scan}" th:text="#{dashboard.scan}">Scan</a>
        <a class="btn btn-outline-primary" th:href="@{/inventory/new}" th:text="#{dashboard.startInventory}">Inventory</a>
      </div>
    </div>
    <div class="col">
      <div class="d-flex justify-content-between align-items-baseline">
        <h2 class="h6" th:text="#{dashboard.recent}">Recent</h2>
        <a class="small" th:href="@{/history}" th:text="#{dashboard.seeAll}">All</a>
      </div>
      <div th:replace="~{fragments/layout :: changes(${recent})}"></div>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
