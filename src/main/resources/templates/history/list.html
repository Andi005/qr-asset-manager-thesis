<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sq">
<head th:replace="~{fragments/layout :: head(#{history.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <h1 class="h3 mb-3" th:text="#{history.title}">History</h1>
  <div class="table-responsive">
    <table class="table table-sm align-middle">
      <thead><tr>
        <th th:text="#{common.when}">When</th>
        <th th:text="#{common.who}">Who</th>
        <th th:text="#{history.entity}">Record</th>
        <th th:text="#{common.what}">What</th>
        <th th:text="#{common.details.col}">Details</th>
      </tr></thead>
      <tbody>
      <tr th:if="${entries.empty}"><td colspan="5" class="text-body-secondary" th:text="#{common.empty}">Empty</td></tr>
      <tr th:each="e : ${entries.content}">
        <td class="text-nowrap" th:text="${@fmt.dateTime(e.at)}">date</td>
        <td th:text="${e.username}">user</td>
        <td class="text-nowrap">
          <span th:text="#{entity.__${e.entityType}__}">type</span>
          <a th:if="${e.entityType.name() == 'ASSET'}" th:href="@{/assets/{id}(id=${e.entityId})}" th:text="'#' + ${e.entityId}">#1</a>
          <a th:if="${e.entityType.name() == 'EMPLOYEE'}" th:href="@{/employees/{id}(id=${e.entityId})}" th:text="'#' + ${e.entityId}">#1</a>
          <a th:if="${e.entityType.name() == 'LICENSE'}" th:href="@{/licenses/{id}(id=${e.entityId})}" th:text="'#' + ${e.entityId}">#1</a>
        </td>
        <td th:text="#{action.__${e.action}__}">action</td>
        <td class="small" th:text="${e.details}">details</td>
      </tr>
      </tbody>
    </table>
  </div>
  <nav th:if="${entries.totalPages > 1}" class="d-flex justify-content-between align-items-center">
    <a class="btn btn-sm btn-outline-secondary" th:classappend="${entries.first} ? 'disabled'"
       th:href="@{/history(page=${entries.number - 1})}" th:text="#{common.previous}">Prev</a>
    <span class="small text-body-secondary" th:text="#{common.pageOf(${entries.number + 1}, ${entries.totalPages})}">1</span>
    <a class="btn btn-sm btn-outline-secondary" th:classappend="${entries.last} ? 'disabled'"
       th:href="@{/history(page=${entries.number + 1})}" th:text="#{common.next}">Next</a>
  </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
