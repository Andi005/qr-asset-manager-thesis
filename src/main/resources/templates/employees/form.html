<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sq">
<head th:replace="~{fragments/layout :: head(${employee == null} ? #{employee.new.title} : #{employee.edit.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 640px">
  <h1 class="h3 mb-3" th:text="${employee == null} ? #{employee.new.title} : #{employee.edit.title}">Employee</h1>
  <form th:action="${employee == null} ? @{/employees} : @{/employees/{id}(id=${employee.id})}"
        th:object="${form}" method="post" novalidate>
    <div th:replace="~{fragments/layout :: globalErrors}"></div>
    <div class="mb-3">
      <label class="form-label" for="fullName" th:text="#{employee.fullName}">Name</label>
      <input class="form-control" th:field="*{fullName}" th:errorclass="is-invalid" maxlength="120" required>
      <div class="invalid-feedback" th:errors="*{fullName}">error</div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">
        <span th:text="#{employee.email}">E-mail</span>
        <span class="text-body-secondary small" th:text="#{common.optional}">(optional)</span>
      </label>
      <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid" maxlength="160">
      <div class="invalid-feedback" th:errors="*{email}">error</div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="department">
        <span th:text="#{employee.department}">Department</span>
        <span class="text-body-secondary small" th:text="#{common.optional}">(optional)</span>
      </label>
      <input class="form-control" th:field="*{department}" th:errorclass="is-invalid" maxlength="120">
      <div class="invalid-feedback" th:errors="*{department}">error</div>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary btn-lg" type="submit" th:text="#{common.save}">Save</button>
      <a class="btn btn-outline-secondary btn-lg"
         th:href="${employee == null} ? @{/employees} : @{/employees/{id}(id=${employee.id})}"
         th:text="#{common.cancel}">Cancel</a>
    </div>
  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
