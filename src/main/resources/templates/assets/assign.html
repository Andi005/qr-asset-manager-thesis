<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sq">
<head th:replace="~{fragments/layout :: head(#{assignment.title(${asset.tag})})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 640px">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <h1 class="h3" th:text="#{assignment.title(${asset.tag})}">Assign</h1>
  <p class="fs-5" th:text="${asset.displayName}">Device</p>

  <div th:if="${current != null}" class="alert alert-warning"
       th:text="#{assignment.error.alreadyAssigned(${asset.tag}, ${current.employee.fullName})}">Assigned</div>
  <div th:if="${current == null and !asset.status.canBeAssigned()}" class="alert alert-warning"
       th:text="#{assignment.error.status(${asset.tag})}">Status</div>

  <form th:if="${current == null and asset.status.canBeAssigned()}"
        th:action="@{/assets/{id}/assign(id=${asset.id})}" method="post">
    <div class="mb-3">
      <label class="form-label" for="employeeId" th:text="#{assignment.employee}">Employee</label>
      <select class="form-select form-select-lg" id="employeeId" name="employeeId" required>
        <option value="" th:text="#{assignment.chooseEmployee}">choose</option>
        <option th:each="e : ${employees}" th:value="${e.id}"
                th:text="${e.fullName} + (${e.department} != null ? ' · ' + ${e.department} : '')">name</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="note">
        <span th:text="#{assignment.note}">Note</span>
        <span class="text-body-secondary small" th:text="#{common.optional}">(optional)</span>
      </label>
      <input class="form-control" id="note" name="note" maxlength="500">
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary btn-lg" type="submit" th:text="#{assignment.submit}">Assign</button>
      <a class="btn btn-outline-secondary btn-lg" th:href="@{/assets/{id}(id=${asset.id})}"
         th:text="#{common.cancel}">Cancel</a>
    </div>
  </form>
  <a th:unless="${current == null and asset.status.canBeAssigned()}" class="btn btn-outline-secondary"
     th:href="@{/assets/{id}(id=${asset.id})}" th:text="#{common.back}">Back</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
