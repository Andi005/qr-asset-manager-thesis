<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sq">
<head th:replace="~{fragments/layout :: head(${asset == null} ? #{asset.new.title} : #{asset.edit.title(${asset.tag})})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <h1 class="h3 mb-3" th:text="${asset == null} ? #{asset.new.title} : #{asset.edit.title(${asset.tag})}">Asset</h1>
  <p th:if="${asset == null}" class="text-body-secondary" th:text="#{asset.tagGenerated}">Tag generated</p>

  <form th:action="${asset == null} ? @{/assets} : @{/assets/{id}(id=${asset.id})}" th:object="${form}"
        method="post" novalidate>
    <div th:replace="~{fragments/layout :: globalErrors}"></div>
    <input type="hidden" th:field="*{version}">

    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="category" th:text="#{asset.field.category}">Category</label>
        <select class="form-select" th:field="*{category}" th:errorclass="is-invalid" required>
          <option value="" th:text="#{asset.chooseCategory}">choose</option>
          <option th:each="c : ${categories}" th:value="${c}" th:text="#{asset.category.__${c}__}">c</option>
        </select>
        <div class="invalid-feedback" th:errors="*{category}">error</div>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="manufacturer" th:text="#{asset.field.manufacturer}">Manufacturer</label>
        <input class="form-control" th:field="*{manufacturer}" th:errorclass="is-invalid" maxlength="80">
        <div class="invalid-feedback" th:errors="*{manufacturer}">error</div>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="model" th:text="#{asset.field.model}">Model</label>
        <input class="form-control" th:field="*{model}" th:errorclass="is-invalid" maxlength="120" required>
        <div class="invalid-feedback" th:errors="*{model}">error</div>
      </div>

      <div class="col-md-4">
        <label class="form-label" for="serialNumber" th:text="#{asset.field.serialNumber}">Serial</label>
        <input class="form-control font-monospace" th:field="*{serialNumber}" th:errorclass="is-invalid"
               maxlength="64" autocapitalize="characters">
        <div class="invalid-feedback" th:errors="*{serialNumber}">error</div>
      </div>
      <div class="col-6 col-md-4">
        <label class="form-label" for="purchaseDate" th:text="#{asset.field.purchaseDate}">Purchase</label>
        <input class="form-control" type="date" th:field="*{purchaseDate}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{purchaseDate}">error</div>
      </div>
      <div class="col-6 col-md-4">
        <label class="form-label" for="warrantyEndDate" th:text="#{asset.field.warrantyEndDate}">Warranty</label>
        <input class="form-control" type="date" th:field="*{warrantyEndDate}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{warrantyEndDate}">error</div>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="locationId" th:text="#{asset.field.location}">Location</label>
        <select class="form-select" th:field="*{locationId}" th:errorclass="is-invalid">
          <option value="" th:text="#{asset.noLocation}">none</option>
          <option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.name}">l</option>
        </select>
        <div class="invalid-feedback" th:errors="*{locationId}">error</div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="status" th:text="#{asset.field.status}">Status</label>
        <select class="form-select" th:field="*{status}" th:errorclass="is-invalid">
          <option th:each="s : ${statuses}" th:value="${s}" th:text="#{asset.status.__${s}__}">s</option>
        </select>
        <div class="invalid-feedback" th:errors="*{status}">error</div>
      </div>

      <div class="col-12">
        <label class="form-label" for="notes" th:text="#{asset.field.notes}">Notes</label>
        <textarea class="form-control" th:field="*{notes}" th:errorclass="is-invalid" rows="3"
                  maxlength="2000"></textarea>
        <div class="invalid-feedback" th:errors="*{notes}">error</div>
      </div>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary btn-lg" type="submit" th:text="#{common.save}">Save</button>
      <a class="btn btn-outline-secondary btn-lg"
         th:href="${asset == null} ? @{/assets} : @{/assets/{id}(id=${asset.id})}" th:text="#{common.cancel}">Cancel</a>
    </div>
  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
