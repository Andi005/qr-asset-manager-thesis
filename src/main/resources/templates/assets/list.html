<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="sq">
<head th:replace="~{fragments/layout :: head(#{asset.list.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1 class="h3 mb-0" th:text="#{asset.list.title}">Assets</h1>
    <a class="btn btn-primary" th:href="@{/assets/new}" sec:authorize="hasAnyRole('ADMIN','IT_STAFF')"
       th:text="#{asset.new}">New</a>
  </div>

  <form class="row g-2 mb-3" th:action="@{/assets}" method="get" role="search">
    <div class="col-md-5">
      <input class="form-control" type="search" name="q" th:value="${q}"
             th:placeholder="#{asset.search.placeholder}" th:attr="aria-label=#{common.search}">
    </div>
    <div class="col-6 col-md-2">
      <select class="form-select" name="status" th:attr="aria-label=#{asset.field.status}">
        <option value="" th:text="#{common.all}">All</option>
        <option th:each="s : ${statuses}" th:value="${s}" th:selected="${s == status}"
                th:text="#{asset.status.__${s}__}">status</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <select class="form-select" name="location" th:attr="aria-label=#{asset.field.location}">
        <option value="" th:text="#{common.all}">All</option>
        <option th:each="l : ${locations}" th:value="${l.id}" th:selected="${l.id == location}"
                th:text="${l.name}">location</option>
      </select>
    </div>
    <div class="col-md-2 d-grid">
      <button class="btn btn-outline-secondary" type="submit" th:text="#{common.search}">Search</button>
    </div>
  </form>

  <!-- The checkboxes feed the label sheet (GET /labels?ids=...). -->
  <form th:action="@{/labels}" method="get" id="labelForm">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="text-body-secondary small" th:text="#{common.total(${page.totalElements})}">0</span>
      <button class="btn btn-sm btn-outline-dark" type="submit" sec:authorize="hasAnyRole('ADMIN','IT_STAFF')"
              th:text="#{asset.printLabels}">Labels</button>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
        <tr>
          <th sec:authorize="hasAnyRole('ADMIN','IT_STAFF')" style="width: 2rem">
            <input class="form-check-input" type="checkbox" id="selectAll" th:title="#{asset.selectAll}">
          </th>
          <th th:text="#{asset.field.tag}">Tag</th>
          <th th:text="#{asset.field.name}">Device</th>
          <th class="d-none d-md-table-cell" th:text="#{asset.field.serialNumber}">Serial</th>
          <th class="d-none d-md-table-cell" th:text="#{asset.field.location}">Location</th>
          <th th:text="#{asset.field.status}">Status</th>
          <th th:text="#{asset.holder}">Holder</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${page.empty}"><td colspan="7" class="text-body-secondary" th:text="#{common.empty}">Empty</td></tr>
        <tr th:each="a : ${page.content}">
          <td sec:authorize="hasAnyRole('ADMIN','IT_STAFF')">
            <input class="form-check-input asset-check" type="checkbox" name="ids" th:value="${a.id}"
                   th:attr="aria-label=${a.tag}">
          </td>
          <td><a class="font-monospace" th:href="@{/assets/{id}(id=${a.id})}" th:text="${a.tag}">IT-000001</a></td>
          <td>
            <div th:text="${a.displayName}">Device</div>
            <div class="small text-body-secondary" th:text="#{asset.category.__${a.category}__}">category</div>
          </td>
          <td class="d-none d-md-table-cell font-monospace small" th:text="${a.serialNumber} ?: #{common.none}">serial</td>
          <td class="d-none d-md-table-cell" th:text="${a.locationName} ?: #{common.none}">location</td>
          <td><span th:replace="~{fragments/layout :: statusBadge(${a.status})}"></span></td>
          <td th:text="${holders.get(a.id)} ?: #{common.none}">holder</td>
        </tr>
        </tbody>
      </table>
    </div>
  </form>

  <nav th:if="${page.totalPages > 1}" class="d-flex justify-content-between align-items-center">
    <a class="btn btn-sm btn-outline-secondary" th:classappend="${page.first} ? 'disabled'"
       th:href="@{/assets(q=${q}, status=${status}, location=${location}, page=${page.number - 1})}"
       th:text="#{common.previous}">Prev</a>
    <span class="small text-body-secondary" th:text="#{common.pageOf(${page.number + 1}, ${page.totalPages})}">1/1</span>
    <a class="btn btn-sm btn-outline-secondary" th:classappend="${page.last} ? 'disabled'"
       th:href="@{/assets(q=${q}, status=${status}, location=${location}, page=${page.number + 1})}"
       th:text="#{common.next}">Next</a>
  </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
