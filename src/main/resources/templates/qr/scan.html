<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sq">
<head th:replace="~{fragments/layout :: head(#{scan.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container scan-page">
  <h1 class="h3" th:text="#{scan.title}">Scan</h1>
  <p class="text-body-secondary" th:text="#{scan.lead}">Lead</p>

  <!-- Texts for the script, so it needs no hard-coded Albanian. -->
  <div id="scan-texts" hidden
       th:data-looking="#{scan.looking}" th:data-camera-error="#{scan.cameraError}"
       th:data-no-code="#{scan.noCodeInPhoto}" th:data-holder="#{scan.holder}"
       th:data-location="#{scan.location}" th:data-nobody="#{asset.noHolder}"
       th:data-open="#{scan.openAsset}"></div>

  <div id="reader" class="scan-reader mb-3"></div>

  <div class="d-grid gap-2 mb-3">
    <button class="btn btn-primary btn-lg" type="button" id="startCamera" th:text="#{scan.start}">Start</button>
    <button class="btn btn-outline-secondary btn-lg" type="button" id="stopCamera" hidden th:text="#{scan.stop}">Stop</button>
    <label class="btn btn-outline-primary btn-lg mb-0" for="photoInput" th:text="#{scan.photo}">Photo</label>
    <input class="d-none" type="file" id="photoInput" accept="image/*" capture="environment">
    <div class="form-text text-center" th:text="#{scan.photoHint}">hint</div>
  </div>

  <form id="manualForm" class="mb-3">
    <label class="form-label" for="manualInput" th:text="#{scan.manual}">Manual</label>
    <div class="input-group input-group-lg">
      <input class="form-control font-monospace" id="manualInput" maxlength="200" autocapitalize="characters"
             th:placeholder="#{scan.manualPlaceholder}">
      <button class="btn btn-outline-primary" type="submit" th:text="#{scan.open}">Open</button>
    </div>
  </form>

  <div id="scanStatus" class="alert d-none" role="status" aria-live="polite"></div>
  <div id="scanResult" class="card d-none">
    <div class="card-body">
      <div class="font-monospace fw-bold fs-4" id="resultTag"></div>
      <div class="fs-5 mb-2" id="resultName"></div>
      <span class="badge mb-2" id="resultStatus"></span>
      <dl class="row mb-3">
        <dt class="col-5" id="resultHolderLabel"></dt>
        <dd class="col-7" id="resultHolder"></dd>
        <dt class="col-5" id="resultLocationLabel"></dt>
        <dd class="col-7" id="resultLocation"></dd>
      </dl>
      <a class="btn btn-primary btn-lg w-100" id="resultLink" href="#"></a>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/webjars/html5-qrcode/html5-qrcode.min.js}"></script>
<script th:src="@{/js/qr-scanner.js}"></script>
<script th:src="@{/js/scan.js}"></script>
</body>
</html>
