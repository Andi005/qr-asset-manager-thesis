# Local run of the whole system (no Java needed):
#   docker compose up --build    → http://localhost:8080, filled with fictional demo data
# Log in as admin / admin12345 (or it / demo12345, viewer / demo12345).
# For an empty system without demo data, set APP_PROFILE to an empty value first
# (PowerShell: $env:APP_PROFILE=""; bash: APP_PROFILE= docker compose up --build).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: qram
      POSTGRES_USER: qram
      POSTGRES_PASSWORD: qram
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qram -d qram"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/qram
      DB_USER: qram
      DB_PASSWORD: qram
      APP_BASE_URL: http://localhost:8080
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin12345}
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE-demo}
    ports:
      - "8080:8080"

volumes:
  db-data:
